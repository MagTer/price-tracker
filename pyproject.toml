[project]
name = "price-tracker"
# The released tag, kept in step with it on purpose: this said 0.1.0 while prod ran v0.3.2.
version = "0.58.2"
description = "Standalone Swedish grocery and pharmacy price tracker (extracted from ai-agent-platform)"
authors = [{ name = "Magnus Ternstrom", email = "claude@falle.se" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "sqlalchemy[asyncio] (>=2.0,<3.0)",
    "alembic (>=1.13,<2.0)",
    "asyncpg (>=0.29,<0.30)",
    # [http2] pulls in `h2`. Not optional: WebFetcher negotiates HTTP/2 because a client that
    # claims to be Chrome and then speaks HTTP/1.1 to a CDN is a fingerprint mismatch every
    # bot-detection layer checks first (see infra/fetcher.py).
    "httpx[http2] (>=0.28,<0.29)",
    # curl_cffi is the DEFAULT fetch transport (env FETCHER_TRANSPORT flips it back to
    # httpx). It impersonates Chrome's TLS ClientHello (JA3) and HTTP/2 SETTINGS — the half
    # of the fingerprint headers cannot reach. Ships prebuilt abi3 wheels, so no toolchain
    # in the image; httpx stays regardless (OpenRouter, Resend, and the fallback path).
    "curl-cffi (>=0.15,<0.16)",
    "pydantic (>=2.7,<3.0)",
    "fastapi (>=0.111,<0.112)",
    "uvicorn[standard] (>=0.30,<0.31)",
    "fastmcp (>=2.0,<3.0)",
]

[tool.poetry]
packages = [
    { include = "domain", from = "src" },
    { include = "infra", from = "src" },
    { include = "api", from = "src" },
    { include = "mcp_server", from = "src" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
ruff = "0.14.4"

# Ruff config inherited from the source repo (ai-agent-platform/services/agent),
# which the Phase 1 rewrite of this pyproject.toml accidentally dropped.
# Deviations from the source: target-version py312 (we run 3.12, source ran 3.11)
# and first-party packages are ours. `ruff format` replaces the source's separate
# black (it is black-compatible); mypy is deliberately not carried over yet.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
# B008: FastAPI's `Depends()`-in-default-argument pattern. Moving the call out of
#       the default argument breaks dependency injection (and thus the auth guard).
# S101: assert is how tests assert.
ignore = ["S101", "S104", "B008", "PLR0912", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["domain", "api", "infra", "mcp_server"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a real Postgres (see tests/conftest.py). Skips cleanly when none is reachable; select with -m integration, exclude with -m 'not integration'.",
]

[tool.pyright]
# Editor/LSP only — pyright is a gate nowhere (not in .github/, not in .claude/).
# It exists so the language server finds the venv: without it every third-party
# import reads as an error and nothing else in the file is legible. pyright does
# NOT auto-detect ./.venv — measured 2026-08-16.
#   poetry install     # creates ./.venv from poetry.lock — see poetry.toml
# `poetry.toml` pins in-project venvs for this repo, so the path below holds for a
# fresh clone with no machine setup and no CI step: one declaration, not a setting
# each environment has to remember. Build it with POETRY, not uv — uv reads
# [project].dependencies but neither the lock nor poetry's dev group, so it resolves
# fresh inside the version ranges. Done that way once, 31 packages landed on versions
# the lock does not carry (cryptography a whole major apart, 50 vs 49, plus alembic,
# greenlet and h2), i.e. checking against libraries that never ship.
#
# Import resolution is ALL this buys, and the number below is not a bug count.
# Project-wide pyright reports 143 errors (2026-08-16), overwhelmingly the pre-2.0
# `Column()` declarations: it sees the Python type where the code uses a
# class-level column expression, so `.is_not()` on a Decimal and `.desc()` on a
# datetime read as errors. No switch fixes that — `typeCheckingMode = "basic"` was
# measured at 145 of 146 before docs/spikes was silenced, i.e. it changes nothing.
# The fix is `Mapped[...]` in models.py, the typing task this port deferred. Treat a
# per-file run as the useful unit; the project total is a backlog, not a report.
venvPath = "."
venv = ".venv"
# `ignore`, NOT `exclude`, and the difference is a trap that costs minutes per run:
# pyright applies its default exclusions (**/node_modules, **/__pycache__, **/.*)
# ONLY while `exclude` is unset. Setting it replaces them, and since `.venv` starts
# with a dot it then gets analysed as source — 3000 files, 192 MB. A run that took
# ~4.5 s stopped finishing at all, and the language server inherits the same job.
# `ignore` silences diagnostics without touching file selection, so it cannot
# reintroduce this. Measured 2026-08-16, after shipping the broken form.
# Contents: deliberate throwaways importing playwright, which is not a dependency
# and should not become one. Nothing else is silenced, and the one project-wide
# find pyright has made is why: scripts/verify_phase2.py called a service method
# that no longer exists, and that directory was deleted rather than ignored
# (2026-08-16). A silenced directory is where such a leftover would have kept sitting.
ignore = ["docs/spikes"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
