name: Release image

# Build + push the container image to GHCR when a version tag is pushed.
# This is the app repo's ONLY deployment responsibility — actually deploying
# is a one-line pinned-tag bump in the home-server repo's
# compose/dokploy-apps/price-tracker/docker-compose.yml (GitOps split:
# app repo = build, platform repo = deployment truth).
#
# Release flow:
#   git tag v0.1.0 && git push origin v0.1.0
#   -> image ghcr.io/magter/price-tracker:v0.1.0 (+ :sha-<commit>)

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/magter/price-tracker
          tags: |
            type=semver,pattern=v{{version}}
            type=sha

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          # The home server is amd64 — build for it explicitly so a future
          # ARM runner change can't silently produce an unrunnable image.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
